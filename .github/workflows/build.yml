name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Keep the producer and consumer on the same isolated Maven repository.
      MAVEN_REPO_LOCAL: ${{ runner.temp }}/maven-repository

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out HaoHanDisplayUI API
        uses: actions/checkout@v4
        with:
          repository: Hao-Han-SMP/HaoHanDisplayUI
          ref: 5731197c0a1f705bd3fff5efb6c29877348427b4
          path: HaoHanDisplayUI

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew HaoHanDisplayUI/gradlew

      - name: Publish HaoHanDisplayUI API locally
        run: |
          ./HaoHanDisplayUI/gradlew -p HaoHanDisplayUI \
            -Dmaven.repo.local="$MAVEN_REPO_LOCAL" \
            publishMavenJavaPublicationToMavenLocal
          test -f "$MAVEN_REPO_LOCAL/vn/haohan/HaoHanDisplayUI/1.0.1/HaoHanDisplayUI-1.0.1.pom"

      - name: Build and test
        run: ./gradlew -Dmaven.repo.local="$MAVEN_REPO_LOCAL" clean build

      - name: Collect deployable JAR
        run: |
          mkdir -p artifacts
          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp '{}' artifacts/ \;

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: artifacts/*.jar
          if-no-files-found: error
